packages:
  - lang
  - cli
  - create
  - ui
  - agent
  - language-server
  - vscode
  - examples/*

allowBuilds:
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: false

# avoid using a package that was released in the last 3 days, for security.
# Use minimumReleaseAgeExclude to bump past a known vulnerability
minimumReleaseAge: 4320

minimumReleaseAgeExclude:
  - serialize-javascript@7.0.5

overrides:
  serialize-javascript: 7.0.5
  'toml': '4.2.0'

onlyBuiltDependencies:
  - '@vscode/vsce-sign'
  - duckdb
  - esbuild
  - svelte-preproces
